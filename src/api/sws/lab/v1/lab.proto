syntax = "proto3";

package sws.lab.v1;

option go_package = "sws-lab/internal/gen/sws/lab/v1;labv1";

// LabService exposes safe unary and streaming calls for testing gRPC routing,
// observability, and Smart Web Security behavior.
service LabService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Echo(EchoRequest) returns (EchoResponse);
  rpc Watch(WatchRequest) returns (stream WatchEvent);
}

message PingRequest {}

message PingResponse {
  string message = 1;
  string app_name = 2;
  string server_time = 3;
}

message EchoRequest {
  string value = 1;
  map<string, string> labels = 2;
}

message EchoResponse {
  string value = 1;
  map<string, string> labels = 2;
  bool executed = 3;
}

message WatchRequest {
  string message = 1;
  int32 count = 2;
  int32 interval_ms = 3;
}

message WatchEvent {
  int32 sequence = 1;
  string message = 2;
  string server_time = 3;
}
